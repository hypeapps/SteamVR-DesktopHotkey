; SteamVR-DesktopHotkey configuration
; Changes take effect after restarting SteamVR.
; Lines starting with ';' are comments. Do not put comments at the end of a value line.

[hotkey]
; 1 = the helper registers the global hotkey below, 0 = no hotkey
; (you can still use: bin\win64\desktop_hotkey_helper.exe --toggle / --open / --close)
enabled=1
; Modifiers: Ctrl, Alt, Shift, Win. Keys: A-Z, 0-9, F1-F24, Numpad0-Numpad9, Space, Home, End,
; Insert, Delete, PageUp, PageDown, Up, Down, Left, Right, Pause, ScrollLock, or 0xNN (virtual-key code).
keys=Ctrl+Alt+D

[dashboard]
; Overlay key of the SteamVR desktop page. Run "desktop_hotkey_helper.exe --probe" to check it.
; Leave empty to just open the dashboard on its last page.
desktop_overlay_key=system.desktop.1
; What the hotkey does when the dashboard is already open:
;   close              - close the dashboard. Look away from the dashboard panel when you press
;                        the hotkey: while you look at the panel the press clicks what you look at.
;   desktop_then_close - if another page is shown, switch to the desktop first; press again to close
when_open=close

[driver]
; 1 = the driver starts the helper together with SteamVR
start_helper=1
; How long the headset input is held, in milliseconds
press_duration_ms=120
; Input profile to extend with the hotkey input. SteamVR reads the bindings right after the headset
; is added, so the profile has to be final by then.
;
; Pimax headset with CustomHeadsetOpenVR: keep the value below. That driver sets its own profile a
;   moment too late, so it is named here to be extended from the start.
;
; Any other headset (Valve Index, HTC Vive, Bigscreen Beyond, Quest via Steam Link or Virtual Desktop,
;   Windows Mixed Reality, ...): leave it empty ("base_profile=") so the profile the headset reports
;   is extended. Keeping the CustomHeadsetOpenVR value is harmless: when that driver is not installed,
;   the headset's own profile is used automatically.
;
; If the SteamVR log shows "Keeping our input profile, the headset driver tried to set '...'",
;   your headset driver sets its profile late as well: put the value from that line here.
base_profile={CustomHeadsetOpenVR}/input/pimaxhmd_profile.json
