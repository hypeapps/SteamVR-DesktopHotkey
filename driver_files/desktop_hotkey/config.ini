; SteamVR-DesktopHotkey configuration
; Changes take effect after restarting SteamVR.
; Lines starting with ';' are comments. Do not put comments at the end of a value line.

[hotkey]
; 1 = the helper registers the global hotkey below, 0 = no hotkey
; (you can still use: bin\win64\desktop_hotkey_helper.exe --toggle / --open / --close)
enabled=1
; Modifiers: Ctrl, Alt, Shift, Win. Keys: A-Z, 0-9, F1-F24, Numpad0-Numpad9, Space, Home, End,
; Insert, Delete, PageUp, PageDown, Up, Down, Left, Right, Pause, ScrollLock, or 0xNN (virtual-key code).
keys=Ctrl+Alt+D

[dashboard]
; Overlay key of the SteamVR desktop page. Run "desktop_hotkey_helper.exe --probe" to check it.
; Leave empty to just open the dashboard on its last page.
desktop_overlay_key=system.desktop.1
; What the hotkey does when the dashboard is already open:
;   close              - close the dashboard
;   desktop_then_close - if another page is shown, switch to the desktop first; press again to close
when_open=close

[driver]
; 1 = the driver starts the helper together with SteamVR
start_helper=1
; 1 = press the headset's own system button (SteamVR handles it natively, so it opens AND closes the
; dashboard). 0 = press the extra input this driver adds, which is bound to the "open dashboard"
; action - that action only opens the dashboard, it never closes it.
use_system_button=1
; How long the headset input is held, in milliseconds
press_duration_ms=120
; Input profile to extend. SteamVR reads the bindings right after the headset is added, so the
; profile has to be final by then; a headset driver that sets its own a moment later would be too
; late. Set this to that driver's profile to extend it from the start. Leave empty for whatever the
; headset reports at activation. Look for "its input profile is ..." in the SteamVR log.
;   CustomHeadsetOpenVR with a Pimax headset: {CustomHeadsetOpenVR}/input/pimaxhmd_profile.json
base_profile=
