; SteamVR-DesktopHotkey configuration
; Changes to [hotkey] and [dashboard] take effect after restarting SteamVR.
; Lines starting with ';' are comments. Do not put comments at the end of a value line.

[hotkey]
; 1 = the helper registers the global hotkey below, 0 = no hotkey
; (you can still use: bin\win64\desktop_hotkey_helper.exe --toggle / --open / --close)
enabled=1
; Modifiers: Ctrl, Alt, Shift, Win. Keys: A-Z, 0-9, F1-F24, Numpad0-Numpad9, Space, Home, End,
; Insert, Delete, PageUp, PageDown, Up, Down, Left, Right, Pause, ScrollLock, or 0xNN (virtual-key code).
keys=Ctrl+Alt+D

[dashboard]
; Overlay key of the SteamVR desktop page. Run "desktop_hotkey_helper.exe --probe" to check it.
; Leave empty to just open the dashboard on its last page.
desktop_overlay_key=system.desktop.1
; What the hotkey does when the dashboard is already open:
;   close              - close the dashboard
;   desktop_then_close - if another page is shown, switch to the desktop first; press again to close
when_open=close

[driver]
; 1 = the driver starts the helper together with SteamVR
start_helper=1
; Role of the virtual button device, i.e. which SteamVR input path it gets:
;   treadmill (default) -> /user/treadmill,  stylus -> /user/stylus,  opt_out -> no input path
;   left / right        -> /user/hand/left or /user/hand/right. Use only for testing: games may then
;                          see an extra "controller" (it has the lowest possible hand priority, so real
;                          controllers are always preferred).
role=treadmill
; How long the virtual button is held, in milliseconds
press_duration_ms=80
; 1 = the virtual device reports a static pose (some SteamVR versions ignore input from devices
; without one). It still has no render model and is not drawn in VR. 0 = no pose at all.
report_pose=1
; Hand selection priority. The default keeps the device out of the way: real controllers always win.
; SteamVR may refuse to assign any role at all with such a low value - set 0 when testing role=left/right.
hand_priority=-1000000
