name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: cmake --install build --config Release --prefix dist/SteamVR-DesktopHotkey

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamVR-DesktopHotkey
          path: dist/

      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/SteamVR-DesktopHotkey -DestinationPath SteamVR-DesktopHotkey-${{ github.ref_name }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SteamVR-DesktopHotkey-${{ github.ref_name }}.zip
